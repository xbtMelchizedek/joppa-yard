[project]
name = "joppa-yard"
version = "0.1.0"
description = "Headless original port-city sim where agents act through inference calls and log FLOP receipts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "xbtMelchizedek" }]
# No runtime dependencies. The live FLOP adapter uses stdlib urllib only.

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
joppa-yard = "joppa_yard.sim:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
